[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "minispire"
version = "1.0.0"
description = "Fast Slay the Spire combat engine for RL research"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rob Pitkin" }]
# 3.11-3.13. Each is tested in CI rather than asserted: the pin was 3.12-only
# because that is what development happened on, not because anything required
# it. The full suite was run on 3.11 and 3.13 before widening this.
requires-python = ">=3.11,<3.14"
keywords = ["reinforcement-learning", "slay-the-spire", "gymnasium", "cpp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Games/Entertainment",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=2.0",
  "gymnasium>=1.3",
]

[project.optional-dependencies]
# Terminal UI: human play (minispire-play), the policy viewer, and
# MinispireEnv.render(). Optional because the RL path never calls any of it —
# someone installing Mini-Spire to train an agent should not be installing a
# rendering stack too. minispire.render.require_tui() turns a missing extra
# into an instruction rather than a ModuleNotFoundError.
tui = [
  "rich>=13.0",
  "textual>=0.80",
]
train = [
  "stable-baselines3>=2.9",
  "sb3-contrib>=2.9",
  "torch>=2.12",
  "wandb>=0.17",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "tensorboard>=2.16",
]
# Lightweight extra for CI: pytest + the deps needed by the fast,
# dependency-light tests (TrainConfig validation needs pydantic/pyyaml).
# Deliberately excludes torch/sb3/wandb to keep CI install fast (~12s vs
# ~60s with the full train extra). Local devs should use [dev].
ci = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",  # Textual's App.run_test() is async
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "minispire[tui]",  # test_play.py covers the renderers
]
# Analysis / plotting for blog artifacts (matplotlib). Separate from train so
# headless training boxes don't pull it; dev includes it.
analysis = [
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "minispire[train]",
  "minispire[analysis]",
  "minispire[tui]",
]

[project.scripts]
minispire-play = "minispire.play:main"
minispire-train = "minispire.train:main"
minispire-eval = "minispire.eval:main"

[project.urls]
# These become the sidebar links on the PyPI page. Repository alone left it
# nearly empty, and a changelog link is the one a user actually wants when
# deciding whether to upgrade.
Homepage = "https://github.com/rob-pitkin/mini-spire"
Repository = "https://github.com/rob-pitkin/mini-spire"
Changelog = "https://github.com/rob-pitkin/mini-spire/blob/main/CHANGELOG.md"
Issues = "https://github.com/rob-pitkin/mini-spire/issues"

[tool.scikit-build]
cmake.version = ">=3.16"
cmake.build-type = "Release"
wheel.packages = ["python/minispire"]
# Only the extension target is needed for the wheel — the CLI binary and the
# GoogleTest binary are dev-only artifacts. (scikit-build-core renamed
# cmake.targets -> build.targets.)
build.targets = ["_core"]

[tool.pytest.ini_options]
# The `analysis/` package lives at the repo root (not in the installed
# wheel — it's research tooling, not part of the shipped package). Add the
# root to the path so its tests can import it.
pythonpath = ["."]
# Textual's App.run_test() is async, so the TUI tests are coroutines. `auto`
# means they do not each need an @pytest.mark.asyncio decorator, and an
# accidentally-undecorated async test cannot silently pass by never running.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
