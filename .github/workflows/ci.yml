name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject.toml claims to support. Claiming 3.11-3.13
        # and testing only 3.12 would make the metadata a guess; the widening
        # was done because the suite was run on all three, and this is what
        # keeps that true.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # v5 runs on Node 24. v4 targets the deprecated Node 20 and is currently
      # force-shimmed by the runner; that shim will go away.
      - uses: actions/checkout@v5

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      # ---- C++ build + tests -----------------------------------------------

      - name: Configure C++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++
        run: cmake --build build --parallel

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

      # ---- Python build + tests --------------------------------------------

      - name: Install uv + Python ${{ matrix.python-version }}
        # v7 is the first major on Node 24; v6 is node20 (deprecated).
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Python package + ci deps (frozen)
        # `uv sync --frozen` installs exactly what's in uv.lock — fails if
        # the lockfile is out of date. `--extra ci` pulls in pytest only,
        # skipping the train extras (torch / sb3) which would dominate
        # CI install time.
        run: uv sync --frozen --extra ci --python ${{ matrix.python-version }}

      - name: Run Python tests
        run: uv run pytest python/tests
